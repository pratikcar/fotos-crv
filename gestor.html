<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Fotos Pátio CRV — Gestão</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="gestor">
<header class="topo">
  <h1>Fotos Pátio CRV — Gestão</h1>
  <span class="selo" id="quem"></span>
  <button class="selo oculto" id="btnSair">Sair</button>
</header>
<main>
  <section id="telaLogin" class="oculto">
    <div class="cartao">
      <h2>Entrar</h2>
      <label for="loginUsuario">Usuário</label>
      <input type="text" id="loginUsuario" autocomplete="username" autocapitalize="none">
      <label for="loginSenha">Senha</label>
      <input type="password" id="loginSenha" autocomplete="current-password">
      <div class="erro" id="loginErro"></div>
      <button class="btn" id="btnEntrar">Entrar</button>
    </div>
  </section>

  <section id="telaApp" class="oculto">
    <div class="abas">
      <button data-aba="abaLotes" class="ativo">Pátios</button>
      <button data-aba="abaNovo">+ Novo pátio (Excel)</button>
      <button data-aba="abaUsuarios" class="oculto" id="botaoAbaUsuarios">Usuários</button>
      <button data-aba="abaConta">Minha senha</button>
    </div>

    <div id="abaLotes" class="tres-col">
      <aside class="col col-patios">
        <div class="col-cab"><span>Pátios</span><button class="btn pequeno cinza" id="btnRecarregar" title="Atualizar">🔄</button></div>
        <div id="listaLotes"></div>
      </aside>
      <section class="col col-lista" id="colLista"><p class="vazio">Escolha um pátio à esquerda para ver os veículos e as fotos.</p></section>
      <section class="col col-detalhe" id="colDetalhe"><p class="vazio">As fotos do veículo aparecem aqui.</p></section>
    </div>

    <div id="abaNovo" class="oculto">
      <div class="cartao">
        <div class="soltar" id="soltar">Arraste aqui a planilha de destinação (.xlsx) ou clique para escolher</div>
        <input type="file" id="inputXlsx" accept=".xlsx" class="oculto">
        <div class="erro" id="novoErro"></div>
        <div id="previa" class="oculto">
          <div id="verificacao"></div>
          <div class="resumo-num" id="previaNums"></div>
          <div class="grade">
            <div><label for="novoPatio">Pátio CRV (obrigatório)</label><input type="text" id="novoPatio" maxlength="60"></div>
            <div><label for="novoLote">Número da lista (opcional)</label><input type="text" id="novoLote" maxlength="30"></div>
          </div>
          <div id="previaAvisos" class="suave"></div>
          <div class="rolagem"><table id="previaTabela"></table></div>
          <div class="linha-btns"><button class="btn verde" id="btnCriarLote">Criar pátio e liberar para o campo</button></div>
        </div>
      </div>
    </div>

    <div id="abaUsuarios" class="oculto">
      <div class="cartao">
        <h3>Novo usuário / editar</h3>
        <div class="grade">
          <div><label for="uUsuario">Usuário (login)</label><input type="text" id="uUsuario" maxlength="30" autocapitalize="none"></div>
          <div><label for="uNome">Nome</label><input type="text" id="uNome" maxlength="60"></div>
          <div><label for="uPapel">Acesso</label>
            <select id="uPapel">
              <option value="campo">Campo — tira as fotos no pátio</option>
              <option value="gestor">Gestão — envia planilhas e baixa fotos</option>
              <option value="admin">Administrador</option>
            </select></div>
          <div><label for="uSenha">Senha (mín. 8; em branco mantém a atual)</label><input type="password" id="uSenha" autocomplete="new-password"></div>
          <div><label><input type="checkbox" id="uAtivo" checked> Ativo</label></div>
        </div>
        <div class="erro" id="uErro"></div>
        <div class="linha-btns"><button class="btn pequeno" id="btnSalvarUsuario">Salvar usuário</button></div>
      </div>
      <div class="cartao"><table id="tabelaUsuarios"></table></div>
    </div>

    <div id="abaConta" class="oculto">
      <div class="cartao">
        <label for="sAtual">Senha atual</label><input type="password" id="sAtual" autocomplete="current-password">
        <label for="sNova">Nova senha (mín. 8)</label><input type="password" id="sNova" autocomplete="new-password">
        <div class="erro" id="sErro"></div>
        <div class="linha-btns"><button class="btn pequeno" id="btnTrocarSenha">Trocar senha</button></div>
      </div>
    </div>
  </section>
</main>

<script src="config.js"></script>
<script src="sync-core.js"></script>
<script src="jszip.min.js"></script>
<script src="xlsx-leitor.js"></script>
<script src="gestor.js"></script>
</body>
</html>
